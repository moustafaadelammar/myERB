name: myERP CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm install
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Validate backend
        run: |
          cd backend
          npm install
          node --check src/server.js

      - name: Start PostgreSQL
        run: |
          docker run -d --name myerb-postgres             -e POSTGRES_DB=myerb             -e POSTGRES_USER=myerb             -e POSTGRES_PASSWORD=myerb             -p 5432:5432             -v "$GITHUB_WORKSPACE/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro"             postgres:16-alpine
          for i in {1..30}; do
            docker exec myerb-postgres pg_isready -U myerb -d myerb && break
            sleep 2
          done
          docker exec myerb-postgres pg_isready -U myerb -d myerb

      - name: Start backend
        run: |
          cd backend
          npm install
          nohup env DATABASE_URL=postgres://myerb:myerb@127.0.0.1:5432/myerb JWT_SECRET=ci-secret node src/server.js > ../backend-ci.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4000/health && break
            sleep 2
          done
          curl --fail http://127.0.0.1:4000/health

      - name: Run backend integration tests
        env:
          MYERP_API_URL: http://127.0.0.1:4000
          REQUIRE_LIVE_API: '1'
        run: |
          cd backend
          npm test

      - name: Show backend log on failure
        if: failure()
        run: cat backend-ci.log

      - name: Build Docker image
        run: docker build --tag myerb:ci .

      - name: Smoke-test container
        run: |
          docker run -d --name myerb-ci -p 8080:80 myerb:ci
          sleep 3
          curl --fail http://127.0.0.1:8080/health
          docker rm -f myerb-ci