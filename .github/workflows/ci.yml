name: myERB CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm install
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Build Docker image
        run: docker build --tag myerb:ci .

      - name: Smoke-test container
        run: |
          docker run -d --name myerb-ci -p 8080:80 myerb:ci
          sleep 3
          curl --fail http://127.0.0.1:8080/health
          docker rm -f myerb-ci
